<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="icon-emerald" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" />
      <stop offset="0.5" stop-color="#059669" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="icon-amber" x1="40" y1="8" x2="8" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" />
      <stop offset="1" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="icon-leaf" x1="24" y1="12" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="48" height="48" rx="12" fill="#0A0D0B" />
  <rect width="48" height="48" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Interlocking Loop -->
  <path
    d="M12 28C8.5 25 8 20 11 16C14 12 20 12.5 24 16C28 12.5 34 12 37 16C40 20 39.5 25 36 28L24 38L12 28Z"
    fill="url(#icon-emerald)"
    fill-opacity="0.25"
    stroke="url(#icon-emerald)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Top Leaf -->
  <path
    d="M24 10C24 10 31 13 31 21C26 21 24 16 24 10Z"
    fill="url(#icon-leaf)"
  />

  <!-- Warmth Accent -->
  <path
    d="M15 32C19 36 29 36 33 32C35 30 38 24 36 20"
    stroke="url(#icon-amber)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Node -->
  <circle cx="24" cy="24" r="3" fill="#10B981" />
</svg>
